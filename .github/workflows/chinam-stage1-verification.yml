name: CHINAM CI
on:
  push:
    branches:
      - main
      - 'chinam/**'
  pull_request:
    branches:
      - main
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies without changing the repository lockfile
        run: npm install --ignore-scripts --package-lock=false
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test (including native Chromium; no skipped tests)
        env:
          CHINAM_REAL_BROWSER_TEST: '1'
        run: npm test
      - name: Vite production build smoke (no DB migration)
        run: node scripts/with-app-env.mjs vite build
      - name: F-04 native Chromium two-tab IndexedDB CAS
        env:
          CHINAM_REAL_BROWSER_TEST: '1'
        run: node --experimental-strip-types --test --test-name-pattern 'R2-F-04-m' src/foundation/stage2.test.mjs
