name: CHINAM CI
on:
  push:
    branches:
      - main
      - 'chinam/**'
  pull_request:
    branches:
      - main
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test (including native Chromium; no skipped tests)
        env:
          CHINAM_REAL_BROWSER_TEST: '1'
        run: npm test
      - name: Verify clean-checkout auth is explicitly disabled
        run: |
          node --input-type=module -e 'import {readAppEnv} from "./scripts/with-app-env.mjs"; const flags = readAppEnv(process.cwd()); if (flags.VITE_AUTH_ENABLED !== "false") { console.error("VITE_AUTH_ENABLED must be false in tracked app-env.json"); process.exit(1); } console.log("VITE_AUTH_ENABLED=false — tracked source config");'
          git ls-files --error-unmatch .grok/app-env.json
          git ls-files --error-unmatch .grok/skills/og/SKILL.md
      - name: Vite production build smoke (no DB migration)
        env:
          VITE_GROK_EXTENSIONS: '0'
        run: PATH="./node_modules/.bin:$PATH" node scripts/with-app-env.mjs vite build
      - name: Verify served production HTML excludes Grok extensions
        env:
          VITE_GROK_EXTENSIONS: '0'
        run: |
          PATH="./node_modules/.bin:$PATH" node scripts/with-app-env.mjs vite preview --host 127.0.0.1 --port 8081 > /tmp/chinam-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8081/ -o /tmp/chinam-rendered.html; then break; fi
            sleep 1
          done
          test -s /tmp/chinam-rendered.html || { cat /tmp/chinam-preview.log; exit 1; }
          if grep -Fq 'grok.com/grok-app-builder/extensions.js' /tmp/chinam-rendered.html; then
            echo "Rendered HTML still contains Grok extensions script"
            exit 1
          fi
      - name: Build kiểu Vercel từ mã nguồn (clean checkout)
        env:
          CI: '1'
        run: |
          # Kept for the next step (built server function check); the runner is discarded after the job.
          CLEAN_DIR="$RUNNER_TEMP/chinam-clean-vercel"
          rm -rf "$CLEAN_DIR" && mkdir -p "$CLEAN_DIR"
          git archive HEAD | tar -x -C "$CLEAN_DIR"
          cd "$CLEAN_DIR"
          test ! -e .vercel/output || { echo "FAIL: stale prebuilt output in clean archive"; exit 1; }
          echo "CLEAN_VERCEL_BUILD: START"
          echo '$ npm install --omit=dev --no-audit --no-fund'
          npm install --omit=dev --no-audit --no-fund
          echo '$ VITE_GROK_EXTENSIONS=0 npm run build'
          VITE_GROK_EXTENSIONS=0 npm run build
          test -d .vercel/output/static || { echo "FAIL: missing .vercel/output/static"; exit 1; }
          if grep -R -F -q 'grok-app-builder/extensions.js' .vercel/output/static; then
            echo "FAIL: legacy Grok extension remains in generated static output"
            exit 1
          fi
          if ! grep -R -F -q 'chinam-foundation-v2' .vercel/output; then
            echo "FAIL: generated Vercel output has no chinam-foundation-v2 marker"
            exit 1
          fi
          echo "CLEAN_VERCEL_BUILD: PASS"
          echo "GROK_EXTENSION_IN_STATIC: ABSENT"
          echo "CHINAM_FOUNDATION_V2_IN_OUTPUT: PRESENT"
      - name: REL-02 — built server function HTML has no Grok extensions script with VITE_GROK_EXTENSIONS=0
        run: node scripts/check-built-server-grok-extension.mjs "$RUNNER_TEMP/chinam-clean-vercel/.vercel/output"
      - name: F-04 native Chromium two-tab IndexedDB CAS
        env:
          CHINAM_REAL_BROWSER_TEST: '1'
        run: node --experimental-strip-types --test --test-name-pattern 'R2-F-04-m' src/foundation/stage2.test.mjs
