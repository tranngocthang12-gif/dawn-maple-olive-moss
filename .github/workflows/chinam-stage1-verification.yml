name: CHINAM CI
on:
  push:
    branches:
      - main
      - 'chinam/**'
  pull_request:
    branches:
      - main
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install declared dependencies without changing the repository lockfile
        run: npm install --ignore-scripts --package-lock=false
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
